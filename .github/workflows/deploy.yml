name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build frontend & server
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/

  build-and-push-image:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '18.163.37.199' }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: GEMINI_API_KEY
          script: |
            mkdir -p /home/${{ secrets.SERVER_USER || 'ubuntu' }}/apps/guanyin-fortune
            cd /home/${{ secrets.SERVER_USER || 'ubuntu' }}/apps/guanyin-fortune
            
            # 若配置了 GEMINI_API_KEY，写入 .env
            if [ -n "$GEMINI_API_KEY" ]; then
              echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
            fi

            echo "📄 0. Syncing latest compose configuration..."
            curl -sSL https://raw.githubusercontent.com/AUPaiDev/guanyin/main/docker-compose.prod.yml -o docker-compose.prod.yml
            
            echo "📥 1. Pulling latest image..."
            docker compose -f docker-compose.prod.yml pull || sudo docker compose -f docker-compose.prod.yml pull
            
            echo "🚀 2. Upgrading container..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans || sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            echo "🩺 3. Health checking..."
            sleep 3
            curl -s http://localhost:3002/api/health
            
            echo ""
            echo "🧹 4. Pruning old images..."
            docker image prune -f || sudo docker image prune -f || true
            
            echo "✅ Deployment successful!"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
